[project]
name = "bittesnor"
version = "0.1.0"
description = "Bittensor subnet for verified sim robot teleop data"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]
