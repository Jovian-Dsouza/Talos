[project]
name = "bittesnor"
version = "0.1.0"
description = "Bittensor subnet for verified sim robot teleop data"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "mujoco==3.17.0",
    "bittensor>=11.3,<12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "cryptography>=43",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
export = ["lerobot[dataset]==0.6.1", "pillow"]
realarm = ["lerobot[feetech]==0.6.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "assets"
