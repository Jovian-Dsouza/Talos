# Render blueprint: hosted miner (web), validator (worker) and Postgres. Values marked sync: false
# are pasted in the Render dashboard (secrets come from scripts/testnet/export_secrets.py). CHAIN_ENDPOINT
# is a wss URL: a Cloudflare tunnel to the local chain (scripts/demo/chain_tunnel.sh), or a public node.
databases:
  - name: taunet-db
    plan: basic-256mb
    databaseName: taunet
    user: taunet

services:
  - type: web
    name: taunet-miner
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    disk:
      name: miner-data
      mountPath: /data
      sizeGB: 2
    envVars:
      - key: CHAIN_ENDPOINT
        sync: false
      - key: NETUID
        sync: false
      - key: MINER_DATA_DIR
        value: /data/hosted
      - key: MINER_TRUST_PROXY
        value: "1"
      - key: MAX_BURN_TAO
        value: "0.05"
      - key: MAX_SIGNUPS_PER_DAY
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: taunet-db
          property: connectionString
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_ALLOWED_ORIGINS
        sync: false
      - key: MINER_ALLOWED_ORIGINS
        sync: false
      - key: MINER_VALIDATOR_ALLOWLIST
        sync: false
      - key: WALLET_ENCRYPTION_KEY
        sync: false
      - key: TREASURY_MNEMONIC
        sync: false

  - type: worker
    name: taunet-validator
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    dockerCommand: python -m validator.main
    plan: starter
    disk:
      name: validator-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: CHAIN_ENDPOINT
        sync: false
      - key: NETUID
        sync: false
      - key: HOSTED_MINER_URL
        value: https://taunet-miner.onrender.com
      - key: VALIDATOR_DB
        value: /data/validator.db
      - key: ACCEPTED_DIR
        value: /data/accepted
      - key: TEMPO_BLOCKS
        value: "360"
      - key: WEIGHTS_EVERY_BLOCKS
        value: "360"
      - key: POLL_SECONDS
        value: "3"
      - key: VALIDATOR_MNEMONIC
        sync: false
