# Open pool, second pool and validator on one VM. Wallets are mounted read-only from the host.
# Set NETUID, CHAIN_ENDPOINT, MINER_PUBLIC_IP and VALIDATOR_HOTKEY_SS58 in deploy/.env first.
x-common: &common
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  environment: &env
    CHAIN_ENDPOINT: ${CHAIN_ENDPOINT:-test}
    NETUID: ${NETUID}
    MINER_PUBLIC_IP: ${MINER_PUBLIC_IP}
    MINER_VALIDATOR_ALLOWLIST: ${VALIDATOR_HOTKEY_SS58}
    MINER_TRUST_PROXY: ${MINER_TRUST_PROXY:-1}
  volumes:
    - ${HOME}/.bittensor/wallets:/root/.bittensor/wallets:ro

services:
  miner-open:
    <<: *common
    command: python -m miner.main
    ports: ["8091:8091"]
    environment:
      <<: *env
      MINER_WALLET: bittesnor-pool-open
      MINER_PORT: "8091"
      MINER_DATA_DIR: /data/open
    volumes:
      - ${HOME}/.bittensor/wallets:/root/.bittensor/wallets:ro
      - miner-open-data:/data/open

  miner-two:
    <<: *common
    command: python -m miner.main
    ports: ["8092:8092"]
    environment:
      <<: *env
      MINER_WALLET: bittesnor-pool-two
      MINER_PORT: "8092"
      MINER_DATA_DIR: /data/two
    volumes:
      - ${HOME}/.bittensor/wallets:/root/.bittensor/wallets:ro
      - miner-two-data:/data/two

  validator:
    <<: *common
    command: python -m validator.main
    environment:
      <<: *env
      VALIDATOR_WALLET: bittesnor-validator
      VALIDATOR_DB: /data/validator.db
      ACCEPTED_DIR: /data/accepted
      TEMPO_BLOCKS: "360"
      WEIGHTS_EVERY_BLOCKS: "100"
      POLL_SECONDS: "3"
    volumes:
      - ${HOME}/.bittensor/wallets:/root/.bittensor/wallets:ro
      - validator-data:/data

volumes:
  miner-open-data:
  miner-two-data:
  validator-data:
